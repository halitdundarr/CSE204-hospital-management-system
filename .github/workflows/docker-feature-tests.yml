name: Docker Feature Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  docker-feature-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Docker and Compose
        run: |
          docker --version
          docker compose version

      - name: Make test script executable
        run: chmod +x scripts/docker_feature_tests.sh

      - name: Run Docker feature expansion checks
        run: ./scripts/docker_feature_tests.sh

      - name: Dump container logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color

      - name: Cleanup containers and volumes
        if: always()
        run: docker compose down -v --remove-orphans
